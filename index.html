<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#2a1f55">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<title>도트 로얄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
<style>
:root{--ink:#fff8e8;--dim:#c9c0e6;--edge:#1b1330;--panel:rgba(30,22,58,.72);--panel-2:rgba(58,42,110,.85);--yellow:#ffd34d;--green:#58e06b;--red:#ff5b5b;
  --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#2a1f55;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{font-family:'Jua',system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink)}
[hidden]{display:none!important}
.o{text-shadow:0 2px 0 var(--edge),2px 0 0 var(--edge),-2px 0 0 var(--edge),0 -2px 0 var(--edge)}
.hd{font-family:'Black Han Sans','Jua',sans-serif;font-weight:400}
canvas#c3d{position:fixed;inset:0;width:100%;height:100%;display:block}
#touch{position:fixed;inset:0;z-index:1}
.ov{position:fixed;inset:0;pointer-events:none}
#tint{z-index:1;opacity:0;background:radial-gradient(ellipse at center,rgba(60,90,255,0) 40%,rgba(60,90,255,.45));transition:opacity .4s}
#hurt{z-index:1;opacity:0;box-shadow:inset 0 0 110px 36px rgba(255,40,40,.65);transition:opacity .25s}
#skillFx{z-index:1;opacity:0;transition:opacity .2s}
#scope{z-index:1;display:none;background:radial-gradient(circle at center,transparent 0,transparent 34vh,rgba(0,0,0,.92) 34.5vh)}
#scope::before,#scope::after{content:'';position:absolute;background:rgba(0,0,0,.8)}
#scope::before{left:50%;top:14vh;bottom:14vh;width:1.5px;transform:translateX(-50%)}
#scope::after{top:50%;left:calc(50% - 34vh);right:calc(50% - 34vh);height:1.5px;transform:translateY(-50%)}
button{font-family:inherit;color:var(--ink);background:var(--panel-2);border:2.5px solid var(--edge);border-radius:12px;cursor:pointer;touch-action:none;padding:0}
button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
button img{pointer-events:none}
#hud{position:fixed;inset:0;z-index:2;pointer-events:none}
#hud button,#inv,#inv *,#loot,#loot *,#mini{pointer-events:auto}
.chip{background:var(--panel);border-radius:8px;padding:2px 9px;font-size:15px;line-height:1.25}
.chip b{color:var(--yellow);font-weight:400}
/* 위쪽 */
#compass{position:absolute;left:50%;top:calc(var(--st) + 6px);transform:translateX(-50%);width:min(420px,46vw);height:34px}
#zoneInfo{position:absolute;left:50%;top:calc(var(--st) + 44px);transform:translateX(-50%);font-size:13px;white-space:nowrap}
#zoneInfo.warn{background:#2f5fd6}
#tl{position:absolute;left:calc(var(--sl) + 10px);top:calc(var(--st) + 8px);display:flex;gap:5px}
#feed{position:absolute;left:calc(var(--sl) + 10px);top:calc(var(--st) + 38px);max-width:40vw;display:flex;flex-direction:column;gap:3px;font-size:12px}
#feed div{background:rgba(27,19,48,.55);border-radius:6px;padding:1px 8px;white-space:nowrap}#feed .me{color:var(--yellow)}
#mini{position:absolute;right:calc(var(--sr) + 10px);top:calc(var(--st) + 8px);width:118px;height:118px;border:2.5px solid var(--edge);border-radius:10px}
/* 조준점 */
#xh{position:absolute;left:50%;top:50%;width:0;height:0}
#xh i{position:absolute;background:#fff;box-shadow:0 0 2px #000}
#xh .t,#xh .b{width:2px;height:8px;left:-1px}#xh .l,#xh .r{height:2px;width:8px;top:-1px}
#xh .d{width:3px;height:3px;left:-1.5px;top:-1.5px;border-radius:50%}
#xh.on i{background:#ff4a4a}
#hitm{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;opacity:0}
#hitm::before,#hitm::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:2.5px;margin-left:-1.25px;background:#fff;transform:rotate(45deg);box-shadow:0 0 2px #000}
#hitm::after{transform:rotate(-45deg)}#hitm.head::before,#hitm.head::after{background:#ff4a4a}
#dirs{position:absolute;left:50%;top:50%;width:0;height:0}
.dmgdir{position:absolute;left:-60px;top:-60px;width:120px;height:120px;border-radius:50%;border:5px solid transparent;border-top-color:rgba(255,60,60,.9);pointer-events:none}
.snd{position:absolute;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:11px solid #fff;filter:drop-shadow(0 0 2px #000);margin:-5px 0 0 -7px}
.snd.gun{border-bottom-color:#ff9a3c}
/* 버튼 */
.hb{position:absolute;display:flex;align-items:center;justify-content:center;flex-direction:column;border-radius:50%;background:rgba(30,22,58,.55);border:2.5px solid rgba(255,248,232,.55);font-size:13px;line-height:1.05}
.hb:active,.hb.on{background:rgba(255,211,77,.45)}
.hb svg{width:55%;height:55%;pointer-events:none}
#bFire{width:92px;height:92px;right:calc(var(--sr) + 28px);bottom:calc(var(--sb) + 70px);background:rgba(255,91,91,.55)}
#bFireL{width:62px;height:62px;left:calc(var(--sl) + 178px);bottom:calc(var(--sb) + 172px);background:rgba(255,91,91,.45)}
#bAds{width:58px;height:58px;right:calc(var(--sr) + 136px);bottom:calc(var(--sb) + 150px)}
#bCrouch{width:54px;height:54px;right:calc(var(--sr) + 132px);bottom:calc(var(--sb) + 60px)}
#bJump{width:52px;height:52px;right:calc(var(--sr) + 30px);bottom:calc(var(--sb) + 178px)}
#bReload{width:50px;height:50px;right:calc(var(--sr) + 204px);bottom:calc(var(--sb) + 108px)}
#bSkill{width:64px;height:64px;right:calc(var(--sr) + 100px);bottom:calc(var(--sb) + 222px);overflow:hidden;border-color:#fff}
#bSkill .cd{position:absolute;inset:0;border-radius:50%;pointer-events:none}#bSkill span,#bSkill small{position:relative}#bSkill small{font-size:10px}
#bSkill.lock{filter:grayscale(1);opacity:.7}#bSkill.ready{animation:rdy 1.2s infinite}
@keyframes rdy{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}50%{box-shadow:0 0 0 8px rgba(255,255,255,0)}}
#bCtx{position:absolute;left:50%;top:62%;transform:translateX(-50%);font-size:16px;padding:6px 16px;border-radius:12px;background:rgba(74,138,46,.85);white-space:nowrap}
#bCtx.jump{background:#ff9a3c;font-size:22px;padding:10px 28px}
#bBag{position:absolute;left:calc(var(--sl) + 10px);bottom:calc(var(--sb) + 10px);width:48px;height:48px;border-radius:12px;font-size:11px}
#bBag img{width:30px;height:30px}
/* 아래 */
#bottom{position:absolute;left:50%;bottom:calc(var(--sb) + 6px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px}
#slots{display:flex;gap:4px}
.slot{width:92px;height:40px;display:flex;align-items:center;gap:3px;padding:0 5px;line-height:1;background:rgba(30,22,58,.6)}
.slot img{width:34px;height:34px;flex:none}.slot .tx{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.slot .nm{font-size:11px;white-space:nowrap;overflow:hidden;max-width:48px}.slot .am{font-size:13px;color:var(--yellow)}
.slot.on{background:rgba(106,79,192,.8);border-color:var(--yellow)}.slot.empty{opacity:.5}
#heals{display:flex;gap:4px;position:absolute;left:calc(50% + 148px);bottom:calc(var(--sb) + 8px)}
.qb{width:42px;height:42px;position:relative;display:flex;align-items:center;justify-content:center;background:rgba(30,22,58,.6)}
.qb img{width:30px;height:30px}.qb b{position:absolute;right:-4px;bottom:-6px;font-weight:400;font-size:11px;background:var(--edge);border-radius:8px;padding:0 5px;color:var(--yellow)}
.qb.off{opacity:.4}
#vit{display:flex;align-items:center;gap:6px}
#who{font-size:12px;padding:1px 8px;border-radius:8px}
#bars{width:260px;display:flex;flex-direction:column;gap:2px}
#boost{height:4px;border-radius:2px;background:rgba(27,19,48,.6);overflow:hidden}#boost i{display:block;height:100%;width:0;background:var(--yellow)}
#hp{height:12px;background:rgba(27,19,48,.7);border-radius:6px;overflow:hidden;position:relative}
#hp i{display:block;height:100%;width:100%;background:#f2f2f2;border-radius:4px}#hp span{position:absolute;inset:0;font-size:10px;line-height:12px;text-align:center;color:#222}
#gear{display:flex;gap:3px}#gear img{width:22px;height:22px;background:var(--panel);border-radius:6px}
.stick{position:absolute;width:130px;height:130px;margin:-65px 0 0 -65px;border:2.5px solid rgba(255,248,232,.4);border-radius:50%;background:rgba(27,19,48,.18);pointer-events:none}
.stick i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,248,232,.55);border:2px solid rgba(27,19,48,.5)}
.stick.run{border-color:var(--yellow)}.stick b{position:absolute;left:50%;top:-30px;transform:translateX(-50%);font-weight:400;font-size:12px;color:var(--yellow);opacity:0}.stick.run b{opacity:1}
#prog{position:absolute;left:50%;top:70%;transform:translateX(-50%);width:170px;background:var(--panel);border-radius:10px;padding:3px 8px 6px;font-size:12px;text-align:center}
#prog i{display:block;height:5px;border-radius:3px;background:var(--yellow);margin-top:3px;width:0}
#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:18px;opacity:0;transition:opacity .3s;white-space:nowrap}
#nums{position:fixed;inset:0;z-index:2;pointer-events:none}
#nums div{position:absolute;font-size:20px;font-family:'Black Han Sans','Jua',sans-serif;color:#fff;transform:translate(-50%,-50%);white-space:nowrap}
#nums div.head{color:#ffd34d;font-size:24px}
/* 주변 아이템 목록 */
#loot{position:absolute;left:calc(var(--sl) + 10px);top:calc(var(--st) + 118px);width:165px;max-height:calc(100vh - 300px);overflow:auto;display:flex;flex-direction:column;gap:3px;touch-action:pan-y}
#loot .li{display:flex;align-items:center;gap:6px;background:rgba(30,22,58,.72);border:2px solid rgba(255,255,255,.18);border-radius:8px;padding:2px 6px;font-size:12px;text-align:left;width:100%}
#loot .li img{width:28px;height:28px;flex:none}#loot .li span{flex:1}#loot .li small{color:var(--yellow)}
#loot .r1{border-color:#5aa0ff}#loot .r2{border-color:#c77dff}#loot .r3{border-color:#ffc83d}
/* 가방 */
#inv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,calc(100vw - 40px));max-height:calc(100vh - 30px);background:rgba(24,18,46,.96);border:2.5px solid var(--edge);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;z-index:3}
#inv header{display:flex;align-items:center;gap:10px;padding:7px 12px;background:#3a2a6e}
#inv header .t{font-size:19px}#wbar{flex:1;height:10px;background:var(--edge);border-radius:6px;overflow:hidden;min-width:60px}#wbar i{display:block;height:100%;background:var(--green);width:0}
#wtxt{font-size:13px;color:var(--dim);white-space:nowrap}#inv label{font-size:13px;display:flex;align-items:center;gap:4px;white-space:nowrap}#inv header button{font-size:14px;padding:3px 12px}
.cols{touch-action:pan-y;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:8px;overflow:auto}
.cols h3{margin:0 0 5px;font-weight:400;font-size:15px;color:var(--yellow)}.list{display:flex;flex-direction:column;gap:4px}
.it{display:flex;align-items:center;gap:6px;background:rgba(58,42,110,.7);border-radius:10px;padding:3px 5px}
.it img{width:30px;height:30px;flex:none}.it .nm{flex:1;font-size:13px;line-height:1.1;min-width:0}.it .nm small{display:block;color:var(--dim);font-size:11px}
.it button{font-size:12px;padding:3px 7px;border-width:2px;border-radius:8px}.empty-note{font-size:12px;color:var(--dim);padding:4px}
#big{position:fixed;inset:0;z-index:5;background:rgba(15,10,30,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
#big canvas{width:min(86vh,86vw);height:min(86vh,86vw);border:3px solid var(--edge);border-radius:14px}#big p{margin:0;font-size:14px;color:var(--dim)}
/* 편집 모드 */
body.edit .hb,body.edit #bBag,body.edit #heals{outline:2px dashed var(--yellow);outline-offset:3px}
#editBar{position:fixed;top:calc(var(--st) + 60px);left:50%;transform:translateX(-50%);z-index:9;display:flex;gap:8px;background:var(--panel);padding:8px 10px;border-radius:12px;font-size:13px;align-items:center}
#editBar button{font-size:13px;padding:5px 10px}
/* 화면들 */
.screen{position:fixed;inset:0;z-index:6;display:flex;padding:calc(var(--st) + 12px) calc(var(--sr) + 14px) calc(var(--sb) + 12px) calc(var(--sl) + 14px)}
#loading{background:#2a1f55;align-items:center;justify-content:center;flex-direction:column;gap:14px}
#loading .title{font-size:58px;color:var(--yellow);margin:0}
#lbar{width:min(360px,70vw);height:14px;border:2.5px solid var(--edge);border-radius:10px;background:#1b1330;overflow:hidden}#lbar i{display:block;height:100%;width:0;background:var(--yellow);transition:width .2s}
#lobby{pointer-events:none;z-index:4}#lobby>*{pointer-events:auto}
#lobby .brand{position:absolute;left:calc(var(--sl) + 18px);top:calc(var(--st) + 10px)}
#lobby .brand h1{margin:0;font-size:38px;color:var(--yellow)}#lobby .brand p{margin:0;font-size:13px}
#lobby .left{position:absolute;left:calc(var(--sl) + 18px);top:calc(var(--st) + 90px);bottom:calc(var(--sb) + 16px);width:min(340px,40vw);display:flex;flex-direction:column;gap:8px}
#chars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cbtn{height:42px;font-size:15px;border-radius:12px}.cbtn.on{border-color:var(--yellow);box-shadow:0 0 0 3px var(--yellow) inset}
#detail{background:var(--panel);border-radius:16px;padding:9px 12px;display:flex;flex-direction:column;gap:5px;overflow:auto;touch-action:pan-y;min-height:0}
#detail h2{margin:0;font-size:24px}
.sk{display:flex;flex-direction:column;gap:1px}.sk .lb{font-size:12px;color:var(--yellow)}.sk .nm2{font-size:16px}.sk .ds{font-size:13px;color:var(--dim);line-height:1.3}
.var{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:12px;line-height:1.3;margin-top:2px}.var b{font-weight:400;white-space:nowrap}.var span{color:var(--dim)}
#lobby .right{position:absolute;right:calc(var(--sr) + 18px);bottom:calc(var(--sb) + 18px);display:flex;flex-direction:column;align-items:flex-end;gap:10px}
#bPlay{font-size:34px;padding:10px 40px;background:#ffc93d;color:var(--edge);border-radius:18px;box-shadow:0 6px 0 var(--edge)}
#best{font-size:14px;color:var(--yellow)}
#lobby .top-right{position:absolute;right:calc(var(--sr) + 18px);top:calc(var(--st) + 14px);display:flex;gap:8px}
#match{z-index:7;background:rgba(20,14,44,.82);align-items:center;justify-content:center;flex-direction:column;gap:14px}
#match h2{margin:0;font-size:40px;color:var(--yellow)}#mCount{font-size:26px}
#mNames{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:620px;min-height:60px}
#mNames span{background:var(--panel);border-radius:8px;padding:2px 8px;font-size:13px;animation:pop .25s}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
#over{z-index:7;background:rgba(20,14,44,.6);align-items:center;justify-content:center}
.card2{background:rgba(30,22,58,.95);border:2.5px solid var(--edge);border-radius:18px;padding:18px 28px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;min-width:260px}
.card2 h2{margin:0;font-size:44px;color:var(--yellow)}.card2 .rank{font-size:22px}.card2 .stats{font-size:15px;color:var(--dim);line-height:1.5}
.big-btn{font-family:'Black Han Sans','Jua',sans-serif;font-size:22px;padding:8px 26px;background:#ffc93d;color:var(--edge)}
#settings{z-index:8;background:rgba(20,14,44,.75);align-items:center;justify-content:center}
#settings .card2{gap:10px;min-width:300px;max-height:calc(100vh - 30px);overflow:auto}
#settings .opt{display:flex;gap:8px;align-items:center;font-size:15px}#settings .opt button{font-size:14px;padding:5px 12px}#settings .opt button.on{background:#6a4fc0;border-color:var(--yellow)}
#settings input[type=range]{width:150px}
#rotate{position:fixed;inset:0;z-index:20;background:#2a1f55;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:30px}
#rotate .ph{width:70px;height:110px;border:5px solid var(--yellow);border-radius:14px;animation:rot 2s infinite ease-in-out}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:900px){#rotate{display:flex}}
@media (max-height:430px){#lobby .brand h1{font-size:30px}#lobby .brand p{display:none}#lobby .left{top:calc(var(--st) + 58px)}#bPlay{font-size:28px;padding:8px 30px}}
@media (prefers-reduced-motion:reduce){#toast,#hurt,#tint{transition:none}#rotate .ph{animation:none}}
</style>
</head>
<body>
<canvas id="c3d"></canvas>
<div id="touch"></div>
<div id="tint" class="ov"></div>
<div id="hurt" class="ov"></div>
<div id="skillFx" class="ov"></div>
<div id="scope" class="ov"></div>
<div id="nums"></div>

<div id="hud" hidden>
  <canvas id="compass" width="840" height="68"></canvas>
  <span id="zoneInfo" class="chip o"></span>
  <div id="tl"><span class="chip o">생존 <b id="alive">25</b></span><span class="chip o">처치 <b id="kills">0</b></span></div>
  <div id="feed" class="o"></div>
  <canvas id="mini" width="236" height="236" aria-label="미니맵, 누르면 전체 지도"></canvas>
  <div id="loot"></div>
  <div id="xh"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i><i class="d"></i></div>
  <div id="hitm"></div>
  <div id="dirs"></div>
  <div class="stick" id="sL"><i></i><b>달리기</b></div>
  <button id="bFire" class="hb" data-id="bFire" aria-label="사격"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="10" fill="none" stroke="#fff" stroke-width="3.5"/><path d="M20 3v10M20 27v10M3 20h10M27 20h10" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/></svg></button>
  <button id="bFireL" class="hb" data-id="bFireL" aria-label="왼쪽 사격"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="10" fill="none" stroke="#fff" stroke-width="3.5"/><path d="M20 3v10M20 27v10M3 20h10M27 20h10" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/></svg></button>
  <button id="bAds" class="hb o" data-id="bAds">조준</button>
  <button id="bCrouch" class="hb o" data-id="bCrouch">앉기</button>
  <button id="bJump" class="hb o" data-id="bJump">점프</button>
  <button id="bReload" class="hb o" data-id="bReload">장전</button>
  <button id="bSkill" class="hb o" data-id="bSkill" aria-label="스킬"><div class="cd"></div><span>스킬</span><small></small></button>
  <button id="bCtx" class="o" hidden><span></span></button>
  <button id="bBag" data-id="bBag" aria-label="가방"><img alt=""><span id="bagPct">0%</span></button>
  <div id="heals" data-id="heals">
    <button class="qb" data-h="bandage" aria-label="붕대"><img alt=""><b>0</b></button>
    <button class="qb" data-h="medkit" aria-label="구급상자"><img alt=""><b>0</b></button>
    <button class="qb" data-h="drink" aria-label="에너지 음료"><img alt=""><b>0</b></button>
  </div>
  <div id="prog" class="o" hidden><span></span><i></i></div>
  <div id="toast" class="o"></div>
  <div id="bottom">
    <div id="vit"><span id="who" class="o"></span><div id="bars"><div id="boost"><i></i></div><div id="hp"><i></i><span id="hpTxt">100</span></div></div><span id="gear"></span></div>
    <div id="slots">
      <button class="slot o" data-s="0"><img alt=""><span class="tx"><span class="nm">빈 슬롯</span><span class="am"></span></span></button>
      <button class="slot o" data-s="1"><img alt=""><span class="tx"><span class="nm">빈 슬롯</span><span class="am"></span></span></button>
      <button class="slot o" data-s="2"><img alt=""><span class="tx"><span class="nm">주먹</span><span class="am"></span></span></button>
    </div>
  </div>
  <div id="inv" hidden>
    <header><span class="t o hd">가방</span><div id="wbar"><i></i></div><span id="wtxt"></span><label><input type="checkbox" id="autoPick" checked> 자동 줍기</label><button id="invClose" class="o">닫기</button></header>
    <div class="cols">
      <section><h3 class="o">주변</h3><div class="list" id="lNear"></div></section>
      <section><h3 class="o">가방</h3><div class="list" id="lBag"></div></section>
      <section><h3 class="o">장비</h3><div class="list" id="lEq"></div></section>
    </div>
  </div>
</div>
<div id="editBar" hidden><span>버튼을 끌어서 옮기세요</span><button id="edReset" class="o">초기화</button><button id="edDone" class="o">완료</button></div>
<div id="big" hidden><canvas id="bigc" width="700" height="700"></canvas><p>화면을 누르면 닫힙니다</p></div>

<div id="loading" class="screen"><h1 class="title o hd">도트 로얄</h1><div id="lbar"><i></i></div><span id="ltxt">3D 모델을 불러오는 중</span></div>
<div id="lobby" class="screen" hidden>
  <div class="brand"><h1 class="o hd">도트 로얄</h1><p class="o">25명 3인칭 배틀로얄</p></div>
  <div class="top-right"><button id="bSettings" class="o" style="font-size:14px;padding:6px 12px">설정</button></div>
  <div class="left"><div id="chars"></div><div id="detail"></div></div>
  <div class="right"><span id="best" class="o"></span><button id="bPlay" class="hd">출격</button></div>
</div>
<div id="match" class="screen" hidden><h2 class="o hd">매칭 중</h2><div id="mCount" class="o">1 / 25</div><div id="mNames"></div><button id="mCancel" class="o" style="font-size:15px;padding:6px 14px">취소</button></div>
<div id="over" class="screen" hidden><div class="card2"><h2 id="oTitle" class="o hd">탈락</h2><div class="rank o" id="oRank"></div><div class="stats" id="oStats"></div><button id="bAgain" class="big-btn">로비로</button></div></div>
<div id="settings" class="screen" hidden><div class="card2"><h2 class="o hd" style="font-size:28px">설정</h2>
  <div class="opt">그래픽 <button data-q="high">높음</button><button data-q="low">낮음</button></div>
  <div class="opt">소리 <button data-s="on">켜기</button><button data-s="off">끄기</button></div>
  <div class="opt">시점 감도 <input type="range" id="sens" min="0.4" max="2.2" step="0.05"><span id="sensV"></span></div>
  <div class="opt">조준 보정 <button data-a="on">켜기</button><button data-a="off">끄기</button></div>
  <div class="opt"><button id="bEdit">버튼 배치 편집</button></div>
  <p style="margin:0;font-size:12px;color:var(--dim);max-width:280px">폰이 뜨거워지거나 끊기면 그래픽을 낮음으로 바꿔 보세요. 그림자·풀잎이 꺼지고 시야 거리가 줄어듭니다.</p>
  <p style="margin:0;font-size:11px;color:var(--dim);max-width:280px">3D 모델·효과음: KayKit, Kenney (CC0)</p>
  <button id="setClose" class="big-btn">닫기</button></div></div>
<div id="rotate"><div class="ph"></div><p class="o" style="font-size:20px;margin:0">폰을 가로로 돌려 주세요</p></div>
<script type="module" src="js/main.js"></script>
</body>
